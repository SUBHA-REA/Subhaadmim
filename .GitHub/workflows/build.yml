                  busy = true;
                  tvMsg.setVisibility(View.GONE);
                  tvLabel.setText("Checking...");
                  new Thread(new Runnable() {
                      public void run() {
                          final String err = verify(key);
                          act.runOnUiThread(new Runnable() {
                              public void run() {
                                  busy = false;
                                  if (err == null) {
                                      sp.edit().putString("key", key).apply();
                                      ok = true;
                                      active = null;
                                      try { dialog.dismiss(); } catch (Exception ignored) {}
                                      Toast.makeText(act, "Login successful", Toast.LENGTH_SHORT).show();
                                  } else {
                                      showMsg(err);
                                      tvLabel.setText("Swipe to Login");
                                      resetKnob();
                                  }
                              }
                          });
                      }
                  }).start();
              }

