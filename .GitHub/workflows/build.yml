          /**
           * Entry point. Call from the target app's main Activity.onCreate:
           *   invoke-static {p0}, Lcom/licensedialog/Login;->show(Landroid/app/Activity;)V
           */
          public class Login {
              static volatile boolean ok = false;
              static Dialog active;

              public static void show(final Activity act) {
                  act.runOnUiThread(new Runnable() {
                      public void run() {
                          if (ok) return;
                          if (active != null) {
                              try { active.dismiss(); } catch (Exception ignored) {}
                              active = null;
                          }
                          new Login(act).start();
                      }
                  });
              }

              final Activity act;
              final String devId;
              final SharedPreferences sp;
              Dialog dialog;
              TextView tvName, tvHandle, tvMsg, tvLabel;
              TextView[] statVals = new TextView[3];
              EditText etKey;
              ImageView avatar;
              FrameLayout slider;
              View knob;
              volatile String followUrl = Config.FOLLOW_URL;
              volatile String bookmarkUrl = Config.BOOKMARK_URL;
              boolean busy = false;

              Login(Activity a) {
                  act = a;
                  sp = a.getSharedPreferences("lic_login", 0);
                  String id = Settings.Secure.getString(a.getContentResolver(), Settings.Secure.ANDROID_ID);
                  devId = id == null ? "unknown" : id;
              }

              // ---------------------------------------------------------------- flow

              void start() {
                  final String saved = sp.getString("key", "");
                  if (saved.length() == 0) { buildAndShow(null); return; }
                  new Thread(new Runnable() {
                      public void run() {
                          final String err = verify(saved);
                          act.runOnUiThread(new Runnable() {
                              public void run() {
                                  if (err == null) ok = true;
                                  else buildAndShow(err);
                              }
                          });
                      }
                  }).start();
              }

              /** returns null when the key is valid, otherwise an error message */
              String verify(String key) {
                  try {
                      key = key.trim();
                      if (!key.matches("[A-Za-z0-9_-]{4,64}")) return "Invalid key format";
                      Net.Res r = Net.request("GET", Config.DB_URL + "/keys/" + key + ".json", null);
                      if (r.code == 0) return "No internet connection";
                      if (r.code != 200) return "Server error (" + r.code + ")";
                      if (r.body == null || !r.body.trim().startsWith("{")) return "Key not found";
                      JSONObject o = new JSONObject(r.body);
                      if (!o.optBoolean("active", true)) return "Key is disabled";
                      long exp = o.optLong("expires", 0);
                      long now = r.serverTime > 0 ? r.serverTime : System.currentTimeMillis();
                      if (exp > 0 && now > exp) return "Key expired";
                      String dev = o.optString("device", "");
                      if (dev.length() == 0) {
                          Net.Res b = Net.request("PUT", Config.DB_URL + "/keys/" + key + "/device.json",
                                  "\"" + devId + "\"");
                          if (b.code != 200) return "Could not activate key";
                      } else if (!dev.equals(devId)) {
                          return "Key is already used on another device";
                      }
                      return null;
                  } catch (Exception e) {
                      return "Error: " + e.getMessage();
                  }
              }

              void doLogin() {
                  final String key = etKey.getText().toString().trim();
                  if (key.length() == 0) {
