          cat > dialog/src/main/java/com/licensedialog/Net.java <<'EOF'
          package com.licensedialog;

          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          class Net {
              static class Res { int code; String body; long serverTime; }

              static Res request(String method, String url, String body) {
                  Res r = new Res();
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setConnectTimeout(10000);
                      c.setReadTimeout(10000);
                      c.setUseCaches(false);
                      c.setRequestMethod(method);
                      if (body != null) {
                          c.setDoOutput(true);
                          c.setRequestProperty("Content-Type", "application/json");
                          OutputStream os = c.getOutputStream();
                          os.write(body.getBytes("UTF-8"));
                          os.close();
                      }
                      r.code = c.getResponseCode();
                      r.serverTime = c.getDate();
                      InputStream in = r.code >= 400 ? c.getErrorStream() : c.getInputStream();
                      if (in != null) {
                          ByteArrayOutputStream bo = new ByteArrayOutputStream();
                          byte[] buf = new byte[4096];
                          int n;
                          while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                          in.close();
                          r.body = bo.toString("UTF-8");
                      }
                  } catch (Exception e) {
                      r.code = 0;
                  } finally {
                      if (c != null) c.disconnect();
                  }
                  return r;
              }

              static Bitmap bitmap(String url) {
                  try {
                      if (url == null || url.length() == 0) return null;
                      HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                      c.setConnectTimeout(10000);
                      c.setReadTimeout(10000);
                      InputStream in = c.getInputStream();
                      Bitmap b = BitmapFactory.decodeStream(in);
                      in.close();
                      return b;
                  } catch (Exception e) {
                      return null;
                  }
              }
          }
          EOF
